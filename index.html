<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Play-Pal</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>body{margin:0;background:#000;color:#fff;font:4vh sans-serif}</style>
</head>
<body>
<cast-media-player></cast-media-player>
<script>
// Eigen Cast-ontvanger van Play-Pal. Speelt dezelfde doorlopende stroom als de standaardontvanger,
// maar meldt "volgende" en "vorige" als ondersteund. Zegt iemand "Hey Google, volgende", dan gaat dat
// niet naar de speler maar als bericht naar Play-Pal op de pc (namespace BEDIENING), met bron "spraak".
// Elk binnenkomend bericht wordt ook als "gezien" doorgegeven, zodat de proef op Eettafel meet welk
// berichttype de Assistent echt stuurt.
// 23-10: op Eettafel kwam de eerste versie niet op (LAUNCH: USER_ALLOWED, daarna niets). Daarom start de
// ontvanger nu als eerste, en staat elke aanvulling los in try/catch: een fout daarin mag het starten nooit
// tegenhouden, en gaat als "fout" naar Play-Pal.
const BEDIENING = 'urn:x-cast:nl.playpal.bediening';
const ctx = cast.framework.CastReceiverContext.getInstance();
const fouten = [];
function probeer(wat, stap) { try { stap(); } catch (e) { fouten.push(wat + ': ' + e); console.log(wat, e); } }
function meld(data) { try { ctx.sendCustomMessage(BEDIENING, undefined, data); } catch (e) { console.log('meld mislukt', e); } }

const opties = new cast.framework.CastReceiverOptions();
opties.customNamespaces = { [BEDIENING]: cast.framework.system.MessageType.JSON };
opties.disableIdleTimeout = true;
probeer('opties', () => {
  const C = cast.framework.messages.Command;
  opties.supportedCommands = C.PAUSE | C.QUEUE_NEXT | C.QUEUE_PREV;
});
ctx.start(opties);

const speler = ctx.getPlayerManager();
const T = cast.framework.messages.MessageType;
function onderschep(soort, verwerk) {
  if (!T[soort]) return;
  probeer('onderschep ' + soort, () => speler.setMessageInterceptor(T[soort], verwerk));
}
function naarPc(opdracht) {
  return verzoek => {
    meld({ type: 'opdracht', opdracht, bron: 'spraak', bericht: verzoek && verzoek.type });
    return null; // niet zelf uitvoeren: Play-Pal op de pc beslist
  };
}
onderschep('LOAD', verzoek => {
  probeer('commando\'s', () => {
    const C = cast.framework.messages.Command;
    speler.setSupportedMediaCommands(C.PAUSE | C.QUEUE_NEXT | C.QUEUE_PREV, true);
  });
  return verzoek;
});
onderschep('QUEUE_UPDATE', verzoek => {
  const sprong = verzoek && verzoek.jump;
  if (sprong > 0) return naarPc('volgende')(verzoek);
  if (sprong < 0) return naarPc('vorige')(verzoek);
  meld({ type: 'gezien', bericht: 'QUEUE_UPDATE', inhoud: JSON.stringify(verzoek).slice(0, 500) });
  return verzoek;
});
onderschep('QUEUE_NEXT', naarPc('volgende'));
onderschep('QUEUE_PREV', naarPc('vorige'));
for (const soort of ['PAUSE', 'PLAY', 'STOP', 'SEEK', 'SKIP_AD', 'USER_ACTION', 'QUEUE_JUMP']) {
  onderschep(soort, verzoek => {
    meld({ type: 'gezien', bericht: soort, inhoud: JSON.stringify(verzoek).slice(0, 500) });
    return verzoek;
  });
}
probeer('luisteren', () => ctx.addCustomMessageListener(BEDIENING, e => {
  if (e.data && e.data.type === 'ping') meld({ type: 'pong', fouten });
}));
probeer('aangesloten', () => ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
  if (fouten.length) meld({ type: 'gezien', bericht: 'fouten', inhoud: fouten.join(' | ') });
}));
</script>
</body>
</html>
