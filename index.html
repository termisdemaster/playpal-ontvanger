<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Play-Pal</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>body{margin:0;background:#000;color:#fff;font:4vh sans-serif}</style>
</head>
<body>
<cast-media-player></cast-media-player>
<script>
// Eigen Cast-ontvanger van Play-Pal. Speelt dezelfde doorlopende stroom als de standaardontvanger,
// maar meldt "volgende" en "vorige" als ondersteund. Zegt iemand "Hey Google, volgende", dan gaat dat
// niet naar de speler maar als bericht naar Play-Pal op de pc (namespace BEDIENING), met bron "spraak".
// Zo ook pauze, afspelen, spoelen, shuffle en herhalen: Play-Pal op de pc beslist, de speaker speelt alleen de
// stroom. Elk ander binnenkomend bericht wordt als "gezien" doorgegeven, zodat de proef op Eettafel meet welk
// berichttype de Assistent echt stuurt.
// 23-10: op Eettafel kwam de eerste versie niet op (LAUNCH: USER_ALLOWED, daarna niets). Daarom start de
// ontvanger nu als eerste, en staat elke aanvulling los in try/catch: een fout daarin mag het starten nooit
// tegenhouden, en gaat als "fout" naar Play-Pal.
const BEDIENING = 'urn:x-cast:nl.playpal.bediening';
const ctx = cast.framework.CastReceiverContext.getInstance();
const fouten = [];
function probeer(wat, stap) { try { stap(); } catch (e) { fouten.push(wat + ': ' + e); console.log(wat, e); } }
function meld(data) { try { ctx.sendCustomMessage(BEDIENING, undefined, data); } catch (e) { console.log('meld mislukt', e); } }

function ONDERSTEUND() {
  const C = cast.framework.messages.Command;
  return ['PAUSE', 'SEEK', 'QUEUE_NEXT', 'QUEUE_PREV', 'QUEUE_SHUFFLE', 'QUEUE_REPEAT_ALL', 'QUEUE_REPEAT_ONE']
    .reduce((alles, naam) => alles | (C[naam] || 0), 0);
}
const opties = new cast.framework.CastReceiverOptions();
opties.customNamespaces = { [BEDIENING]: cast.framework.system.MessageType.JSON };
opties.disableIdleTimeout = true;
probeer('opties', () => {
  const C = cast.framework.messages.Command;
  opties.supportedCommands = ONDERSTEUND();
});
// [cast-vertraging] 23-10: op Eettafel speelde de speaker bij elke start 0,1-1 s, ging dan 5,5-6 s bufferen, en liep
// daarna de hele sessie zoveel achter (bovenop de 3 s voorsprong van Play-Pal): ~10 s van "volgende" tot horen.
// Daarom: de bufferdrempels van CAF laag, en na zo'n stilstand terugspringen naar vlak achter het ontvangen eind.
probeer('afspeelinstellingen', () => {
  const pc = new cast.framework.PlaybackConfig();
  pc.autoPauseDuration = 0.5;  // pas bufferen als er minder dan 0,5 s klaarstaat
  pc.autoResumeDuration = 1;   // en weer spelen zodra er 1 s klaarstaat
  opties.playbackConfig = pc;
});
ctx.start(opties);

const speler = ctx.getPlayerManager();
const T = cast.framework.messages.MessageType;
function onderschep(soort, verwerk) {
  if (!T[soort]) return;
  probeer('onderschep ' + soort, () => speler.setMessageInterceptor(T[soort], verwerk));
}
function naarPc(opdracht) {
  return verzoek => {
    meld({ type: 'opdracht', opdracht, bron: 'spraak', bericht: verzoek && verzoek.type });
    return null; // niet zelf uitvoeren: Play-Pal op de pc beslist
  };
}
onderschep('LOAD', verzoek => {
  probeer('commando\'s', () => {
    const C = cast.framework.messages.Command;
    speler.setSupportedMediaCommands(ONDERSTEUND(), true);
  });
  return verzoek;
});
function naarPcMet(opdracht, extra) {
  return verzoek => { meld(Object.assign({ type: 'opdracht', opdracht, bron: 'spraak' }, extra)); return null; };
}
const HERHALEN = { REPEAT_OFF: 'uit', REPEAT_ALL: 'lijst', REPEAT_SINGLE: 'nummer', REPEAT_ALL_AND_SHUFFLE: 'lijst' };
onderschep('QUEUE_UPDATE', verzoek => {
  const v = verzoek || {};
  if (v.jump > 0) return naarPc('volgende')(v);
  if (v.jump < 0) return naarPc('vorige')(v);
  if (typeof v.shuffle === 'boolean') return naarPcMet('shuffle', { aan: v.shuffle })(v);
  if (HERHALEN[v.repeatMode]) {
    if (v.repeatMode === 'REPEAT_ALL_AND_SHUFFLE') meld({ type: 'opdracht', opdracht: 'shuffle', bron: 'spraak', aan: true });
    return naarPcMet('herhalen', { stand: HERHALEN[v.repeatMode] })(v);
  }
  meld({ type: 'gezien', bericht: 'QUEUE_UPDATE', inhoud: JSON.stringify(v).slice(0, 500) });
  return verzoek;
});
onderschep('PAUSE', naarPc('pauze'));
onderschep('PLAY', naarPc('afspelen'));
onderschep('SEEK', verzoek => {
  const v = verzoek || {};
  if (typeof v.relativeTime === 'number') return naarPcMet('spoelen', { seconden: v.relativeTime })(v);
  if (typeof v.currentTime === 'number') return naarPcMet('spoelen', { seconden: v.currentTime, absoluut: true })(v);
  meld({ type: 'gezien', bericht: 'SEEK', inhoud: JSON.stringify(v).slice(0, 500) });
  return null;
});
for (const soort of ['STOP', 'SKIP_AD', 'USER_ACTION', 'QUEUE_JUMP', 'QUEUE_REORDER']) {
  onderschep(soort, verzoek => {
    meld({ type: 'gezien', bericht: soort, inhoud: JSON.stringify(verzoek).slice(0, 500) });
    return verzoek;
  });
}
// Meten en bijspringen ([cast-vertraging]). "voor" = ontvangen maar nog niet gespeeld: zo lang duurt het van een
// nieuw nummer in de stroom tot het klinkt. Elke meting gaat als "gezien" naar playpal.log op de pc.
const DOEL = 3;           // zoveel buffer na een sprong (de voorsprong van Play-Pal, die zonder stilstand speelde)
const MARGE = 1.5;        // pas springen als we zoveel meer achter lopen dan DOEL
const r = x => Math.round(x * 100) / 100;
let el = null, wachtSinds = 0, sprongen = 0, laatsteSprong = 0, springenUit = false;
function stand(e) {
  const b = e.buffered, eind = b.length ? b.end(b.length - 1) : 0;
  return { tijd: r(e.currentTime), eind: r(eind), voor: r(eind - e.currentTime), klaar: e.readyState, net: e.networkState };
}
function meldStand(reden, extra) {
  if (el) meld(Object.assign({ type: 'gezien', bericht: 'stand', reden }, stand(el), extra || {}));
}
function bijspringen(reden) {
  if (!el || springenUit || sprongen >= 3 || Date.now() - laatsteSprong < 60000) return;
  const s = stand(el);
  if (s.klaar < 3 || s.voor <= DOEL + MARGE) return;
  el.currentTime = s.eind - DOEL;
  sprongen++; laatsteSprong = Date.now();
  meldStand('gesprongen', { was: s.voor, sprong: sprongen, door: reden || 'stilstand' });
}
// [cast-vertraging] 24-10 21:12 op plopwezen: de speaker begon pas 6 s na het verbinden en bleef de hele sessie vast op
// "voor" 8,5 s, zonder ooit te stilstaan; dan sprong hij nooit bij. Nu ook: speelt hij 10 s aan één stuk meer dan
// DOEL + MARGE achter (niet tijdens een pauze), dan springt hij, met dezelfde grenzen als na een stilstand.
const TE_VER_MS = 10000;
let teVerSinds = 0;
function kijkAchterstand() {
  if (!el || el.paused) { teVerSinds = 0; return; }
  const s = stand(el);
  if (s.klaar < 3 || s.voor <= DOEL + MARGE) { teVerSinds = 0; return; }
  if (!teVerSinds) { teVerSinds = Date.now(); return; }
  if (Date.now() - teVerSinds >= TE_VER_MS) { teVerSinds = 0; bijspringen('te ver achter'); }
}
// 24-10: op de speakers kwam nooit een "stand" binnen. Daarom zoekt de ontvanger het element ook zelf (in de pagina en
// in de shadow-DOM van cast-media-player) en meldt hij bij elke verbinding een diagnose met zijn versie.
const VERSIE = 'achterstand-2710';
function zoekElement() {
  let e = null;
  try { e = speler.getMediaElement && speler.getMediaElement(); } catch (x) { }
  if (e) return [e, 'getMediaElement'];
  e = document.querySelector('audio, video');
  if (e) return [e, 'document'];
  const cmp = document.querySelector('cast-media-player');
  e = cmp && cmp.shadowRoot && cmp.shadowRoot.querySelector('audio, video');
  return e ? [e, 'shadowRoot'] : [null, 'geen'];
}
function diagnose(reden) {
  const [e, waar] = zoekElement();
  meld({ type: 'gezien', bericht: 'diagnose', reden, versie: VERSIE, waar, element: e ? e.tagName : null,
    getMediaElement: typeof speler.getMediaElement, gekoppeld: !!el, fouten: fouten.slice(-5).join(' | ') });
}
function koppelElement() {
  const [e] = zoekElement();
  if (!e || e === el) return;
  el = e;
  el.addEventListener('waiting', () => {
    wachtSinds = Date.now();
    if (laatsteSprong && Date.now() - laatsteSprong < 15000) { springenUit = true; meldStand('wacht na sprong, bijspringen uit'); }
    else meldStand('wacht');
  });
  el.addEventListener('playing', () => {
    const duur = wachtSinds ? r((Date.now() - wachtSinds) / 1000) : 0;
    meldStand('speelt', { wachtte: duur });
    if (wachtSinds) setTimeout(bijspringen, 2000);
    wachtSinds = 0;
  });
  el.addEventListener('stalled', () => meldStand('stokt'));
  meldStand('gekoppeld');
}
probeer('meten', () => {
  setInterval(() => probeer('meten', () => { koppelElement(); kijkAchterstand(); }), 1000);
  setInterval(() => probeer('meten', () => meldStand('elke 30 s')), 30000);
});
probeer('luisteren', () => ctx.addCustomMessageListener(BEDIENING, e => {
  if (e.data && e.data.type === 'ping') { meld({ type: 'pong', fouten }); diagnose('ping'); }
  // [pauze-eigen-ontvanger] 27-10: pauze en verder van Play-Pal zelf komen hier, niet als media-PAUSE/PLAY. Die
  // onderscheppers sturen alles terug als spraakopdracht, en VoerPauze wisselt dan weer naar spelen. Hier wordt niets
  // teruggemeld als opdracht, alleen als "gezien".
  if (e.data && e.data.type === 'speler') {
    const opdracht = e.data.opdracht;
    if (opdracht === 'pauze') probeer('speler pauze', () => speler.pause());
    else if (opdracht === 'afspelen') probeer('speler afspelen', () => speler.play());
    meld({ type: 'gezien', bericht: 'speler', inhoud: String(opdracht) });
  }
}));
probeer('aangesloten', () => ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
  if (fouten.length) meld({ type: 'gezien', bericht: 'fouten', inhoud: fouten.join(' | ') });
  diagnose('verbonden');
  setTimeout(() => diagnose('na 10 s'), 10000);
}));
</script>
</body>
</html>
